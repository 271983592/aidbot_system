<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>InsightFace + Silent-Face (Caffe)</title>
    <style>
      body { font-family: sans-serif; margin: 20px; }
      img { width: 960px; max-width: 100%; border: 1px solid #ccc; }
      button { padding: 8px 12px; margin-right: 8px; }
      code { background: #f6f6f6; padding: 2px 6px; }
    </style>
  </head>
  <body>
    <h2>InsightFace(检测+识别) + Silent-Face-Anti-Spoofing(Caffe)</h2>
    <div>
      <button onclick="reloadDB()">Reload DB</button>
      <span id="status"></span>
    </div>
    <p><img src="/video"></p>

    <script>
      async function reloadDB(){
        document.getElementById("status").innerText = "reloading...";
        const r = await fetch("/reload_db", {method:"POST"});
        const j = await r.json();
        document.getElementById("status").innerText =
          "DB: " + (j.people||[]).join(", ");
      }
    </script>
  </body>
</html>
